  <div id="app-splash" aria-hidden="true">
    <style>
      #app-splash {
        position: fixed;
        inset: 0;
        z-index: 4000;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        overflow: hidden;
        perspective: 56rem;
        background:
          radial-gradient(ellipse 42rem 28rem at 50% 38%, rgba(43, 158, 217, 0.28) 0%, transparent 62%),
          linear-gradient(180deg, #102030 0%, #0b141c 48%, #070b10 100%);
        transition: opacity 0.2s ease;
      }
      #app-splash.is-leaving {
        opacity: 0;
        pointer-events: none;
      }
      #app-splash.is-embed {
        display: none;
      }
      #app-splash .stage {
        position: relative;
        width: 14rem;
        height: 14rem;
        margin-bottom: 1.75rem;
        transform: rotateX(18deg);
        transform-style: preserve-3d;
      }
      #app-splash .ring,
      #app-splash .ring-mid {
        position: absolute;
        top: 50%;
        left: 50%;
        border: 0.125rem solid rgba(94, 200, 255, 0.28);
        border-radius: 50%;
      }
      #app-splash .ring {
        width: 12.5rem;
        height: 12.5rem;
        margin: -6.25rem 0 0 -6.25rem;
        animation: app-splash-orbit 7.5s linear infinite;
      }
      #app-splash .ring-mid {
        width: 10rem;
        height: 10rem;
        margin: -5rem 0 0 -5rem;
        border-color: rgba(43, 158, 217, 0.38);
        animation: app-splash-orbit-reverse 5.5s linear infinite;
      }
      #app-splash .cube {
        position: absolute;
        top: 50%;
        left: 50%;
        width: 5.5rem;
        height: 5.5rem;
        margin: -2.75rem 0 0 -2.75rem;
        transform-style: preserve-3d;
        animation: app-splash-cube 8s linear infinite;
      }
      #app-splash .face {
        position: absolute;
        inset: 0;
        border: 0.0625rem solid rgba(94, 200, 255, 0.38);
        border-radius: 0.5rem;
        background: linear-gradient(145deg, rgba(94, 200, 255, 0.16), rgba(15, 40, 58, 0.08));
      }
      #app-splash .face.front { transform: translateZ(2.75rem); }
      #app-splash .face.back { transform: rotateY(180deg) translateZ(2.75rem); }
      #app-splash .face.right { transform: rotateY(90deg) translateZ(2.75rem); }
      #app-splash .face.left { transform: rotateY(-90deg) translateZ(2.75rem); }
      #app-splash .face.top { transform: rotateX(90deg) translateZ(2.75rem); }
      #app-splash .face.bottom { transform: rotateX(-90deg) translateZ(2.75rem); }
      #app-splash .logo {
        position: absolute;
        z-index: 2;
        top: 50%;
        left: 50%;
        display: block;
        width: 4.25rem;
        height: 4.25rem;
        margin: -2.125rem 0 0 -2.125rem;
        border-radius: 50%;
        filter: drop-shadow(0 0.75rem 1.125rem rgba(43, 158, 217, 0.48));
        animation: app-splash-logo 2.6s ease-in-out infinite;
      }
      #app-splash .brand {
        font-family: system-ui, sans-serif;
        font-size: 1.375rem;
        font-weight: 600;
        letter-spacing: 0.08em;
        color: #f4fbff;
      }
      @keyframes app-splash-orbit {
        from { transform: rotateX(72deg) rotateZ(0deg); }
        to { transform: rotateX(72deg) rotateZ(360deg); }
      }
      @keyframes app-splash-orbit-reverse {
        from { transform: rotateX(66deg) rotateY(28deg) rotateZ(360deg); }
        to { transform: rotateX(66deg) rotateY(28deg) rotateZ(0deg); }
      }
      @keyframes app-splash-cube {
        from { transform: rotateX(-18deg) rotateY(0deg); }
        to { transform: rotateX(-18deg) rotateY(360deg); }
      }
      @keyframes app-splash-logo {
        0%, 100% { transform: translateY(0) rotateY(-18deg); }
        50% { transform: translateY(-0.5rem) rotateY(18deg); }
      }
      @media (prefers-reduced-motion: reduce) {
        #app-splash .ring,
        #app-splash .ring-mid,
        #app-splash .cube,
        #app-splash .logo { animation: none; }
      }
    </style>
